spring.application.name=JDE-MCP-SERVER
mcp.ai.mcp.server.name=JDE-MCP-SERVER
mcp.ai.mcp.server.version=1.0.4-52

# Confiar en X-Forwarded-Proto/Host/Port cuando el server esta detras de un reverse
# proxy que termina TLS (ngrok en dev/demo, Caddy en prod). Sin esto, Tomcat ve el
# request como HTTP plano (el proxy le habla en HTTP puertas adentro) y
# ServletUriComponentsBuilder arma URLs "http://" en vez de "https://" -- rompe
# /.well-known/oauth-protected-resource (el "resource" no matchea el https:// real
# que uso el cliente MCP, y el login OAuth falla). Inofensivo sin proxy delante.
server.forward-headers-strategy=framework

# Perfil activo por defecto: dev (servicios locales en localhost, ver application-dev.properties).
# Para stage/prod, fijar la variable de entorno SPRING_PROFILES_ACTIVE=stage|prod al desplegar
# (tiene prioridad sobre este default y no requiere tocar este archivo).
spring.profiles.active=dev

# MCP Server Configuration
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.type=sync

# Rol de realm requerido para aprobar/rechazar ordenes de compra
# (realm_access.roles del token de Keycloak)
jde.mcp.security.approver-role=purchase-order-approve
# Audiencia esperada en el token: debe coincidir con el claim "aud" que emite el
# mapper de audiencia del client (hoy: el propio clientId atina-mcp-server, igual en
# todos los ambientes; si un ambiente usara otro clientId, sobreescribir por perfil)
jde.mcp.security.expected-audience=atina-mcp-server
# Jwks-uri fijo para el decoder de Keycloak, desacoplado del issuer-uri (ver
# SecurityConfig.keycloakDecoder). Vacio (default): comportamiento normal, discovery
# completo contra spring.security.oauth2.resourceserver.jwt.issuer-uri (funciona
# cuando ese issuer es alcanzable directamente desde donde corre el MCP Server -- IDE
# local, o detras de ngrok/Caddy con el mismo dominio publico puertas adentro).
# Setear SOLO si el MCP Server corre containerizado y el issuer publico (lo que
# Keycloak realmente firma) no es alcanzable desde el contenedor -- apuntar a la URL
# interna real del JWKS (ver docker/.env.local).
jde.mcp.security.keycloak-jwks-uri=${KEYCLOAK_JWKS_URI:}

# Gateway de Atina: operaciones BSSV genéricas (POST /v1/operations/execute).
# Lo usan los tools de sales order de consulta de cliente (lookupAddressBook) y
# detalle de cliente (getCustomerV3). El token de sesión JDE viaja como
# "Authorization: Bearer <token>".
# La URL base (jde.atina.gateway.base-url) es especifica de cada ambiente, ver
# application-{dev,stage,prod}.properties.
# Timeout (en minutos) para las respuestas del Gateway de Atina. El Gateway puede
# tardar bastante en resolver operaciones BSSV, asi que este valor puede subirse
# sin tocar codigo.
jde.atina.gateway.timeout-minutes=10
# Valor de la cabecera "TransactionId" que se envia en cada operacion del Gateway
jde.atina.gateway.transaction-id=12345
# Timeout (en segundos, no minutos) para POST /v1/logs/capture (AtinaLogCaptureClient,
# usado por GET /admin/logs?includeMicroserviceLogs=true) -- a diferencia de las
# operaciones BSSV de arriba, esto es una consulta de diagnostico: tiene que
# responder rapido o fallar rapido, no esperar hasta jde.atina.gateway.timeout-minutes.
jde.atina.gateway.logs-capture-timeout-seconds=30

# Purchase order approval: operaciones BSSV del Gateway de Atina (JP430000.ProcurementManager).
# Defaults usados por jde_list_pending_purchase_orders cuando el caller no informa
# los parametros opcionales orderTypeCode / businessUnitCode / statusCodeNext, y por
# jde_get_purchase_order_detail para el statusCodeNext de getPurchaseOrderDetailForApprover.
jde.purchase.default-order-type-code=OP
jde.purchase.default-business-unit-code=30
jde.purchase.default-status-code-next=230
# Fijo (no es parametro del tool): status de aprobacion consultado en jde_list_pending_purchase_orders
jde.purchase.default-status-approval=2N
# Processing version del programa P43081 (approve/reject) enviada a processPurchaseOrderApproveReject
jde.purchase.p43081-version=ZJDE0001
# Nombre del claim en el token de sesion JDE (Atina) que trae el address book number
# (entityId) del aprobador logueado; usado como approver.entityId / approverAddressNumber
# en las operaciones BSSV de aprobacion de purchase orders.
jde.atina.address-book-claim=addressBookNumber
# TTL (en minutos) del cache en memoria de purchase orders pendientes (equivalente al
# Object Store de Mulesoft) que puebla jde_list_pending_purchase_orders y consumen
# jde_approve_purchase_order / jde_reject_purchase_order. Pasado este tiempo sin
# aprobar/rechazar, la orden se purga y hay que volver a listarla.
jde.purchase.pending-order-ttl-minutes=45
# Frecuencia (en minutos) del barrido que purga del cache las ordenes vencidas aunque
# nadie las vuelva a pedir. Debe ser menor al TTL para que la purga sea oportuna.
jde.purchase.pending-order-cleanup-interval-minutes=10

# jde_list_pending_purchase_orders puede tardar varios minutos contra un ambiente
# JDE ocupado -- muchos clientes MCP (Slack, etc.) tienen su propio timeout de
# infraestructura que no se puede extender desde el server (ver LongRunningTaskRegistry,
# com.atina.jdeMCPServer.mcp.tasks). Con esto habilitado, el tool arranca la consulta
# en background y devuelve rapido "todavia en curso" si no termina a tiempo, en vez de
# bloquear el request hasta que el Gateway responda. Apagar (false) para volver al
# comportamiento 100% sincrono/bloqueante de antes (kill switch rapido).
jde.purchase.pending-orders.async.enabled=false
# Cuanto espera la PRIMERA llamada antes de devolver "todavia en curso" -- si el
# Gateway responde antes de esto, esa misma llamada ya devuelve el resultado real,
# sin necesitar una segunda vuelta.
jde.purchase.pending-orders.async.initial-wait-seconds=8

# Defaults para el tool jde_get_item_price cuando el caller no informa estos valores opcionales
jde.pricing.default-unit-of-measure=EA
jde.pricing.default-processing-version=ZJDE0001

# jde_search_items (busqueda de articulos) usa el mismo motor generico de tareas
# largas que jde_list_pending_purchase_orders (jde.mcp.tasks.*, ver mas abajo) --
# no requiere properties nuevas del motor, solo el kill switch/wait propios de este
# tool (misma logica: arranca la busqueda en background y devuelve rapido "todavia
# en curso" si no termina a tiempo, en vez de bloquear el request).
jde.item-search.async.enabled=false
jde.item-search.async.initial-wait-seconds=60

# jde_get_item_list_price (precio de lista, sin cliente) -- mismo motor y misma
# logica que jde.item-search.async.* de arriba.
jde.item-list-price.async.enabled=false
jde.item-list-price.async.initial-wait-seconds=60

# jde_lookup_customer_by_name / jde_get_customer_detail / jde_get_customer_credit_info
# -- mismo motor y misma logica que jde.item-search.async.* de arriba.
jde.customer-lookup.async.enabled=false
jde.customer-lookup.async.initial-wait-seconds=60
jde.customer-detail.async.enabled=false
jde.customer-detail.async.initial-wait-seconds=60
jde.customer-credit.async.enabled=false
jde.customer-credit.async.initial-wait-seconds=60

# ============================================================================
# Sales Cart (carrito de compras en memoria) -- com.atina.jdeMCPServer.cart.
# Un unico carrito activo por sesion MCP (keyed por Mcp-Session-Id), sin Redis
# ni Postgres en esta primera etapa -- se pierde si el server se reinicia (ver
# limitaciones de idempotencia documentadas en SalesCartService.submitCart).
# ============================================================================

# TTL deslizante (en minutos) de un carrito inactivo en memoria: se renueva en
# cada operacion sobre el carrito (InMemorySalesCartRepository.save/update).
# Pasado este tiempo SIN actividad, se considera expirado (eviccion perezosa
# en findBySessionId + barrido periodico, ver jde.cart.cleanup-interval-minutes).
# Adaptado del "expiration: PT2H" (ISO-8601 Duration) sugerido originalmente --
# este proyecto no usa @ConfigurationProperties ni Duration en properties (ver
# jde.purchase.pending-order-ttl-minutes), asi que se expresa como minutos
# simples, convertido a Duration en el constructor.
jde.cart.ttl-minutes=120
# Frecuencia (en minutos) del barrido que purga carritos vencidos aunque nadie
# los vuelva a pedir. Debe ser menor al TTL para que la purga sea oportuna
# (mismo criterio que jde.purchase.pending-order-cleanup-interval-minutes).
jde.cart.cleanup-interval-minutes=15
# Maximo de carritos activos simultaneos en memoria (proteccion basica de
# memoria en esta etapa sin Redis -- un limite de proceso, no por usuario).
# Superado, jde_create_current_sales_cart y la auto-creacion en
# jde_add_item_to_current_sales_cart devuelven errorCode=CART_LIMIT_EXCEEDED.
jde.cart.max-active-carts=500

# Chequear disponibilidad de stock (getItemPriceAndAvailabilityV3 en vez de
# getCustomerItemPrice) al agregar/actualizar una linea del carrito.
jde.cart.check-availability-on-add=false
# Chequear disponibilidad al revalidar el carrito completo (jde_validate_current_sales_cart).
jde.cart.check-availability-on-validate=true
# Chequear el credito del cliente (jde_get_customer_credit_info) antes de
# permitir jde_submit_current_sales_cart.
jde.cart.check-credit-on-submit=false
# Si check-credit-on-submit=true y el cliente excede su limite de credito,
# bloquear el submit (errorCode=CREDIT_LIMIT_EXCEEDED) en vez de solo advertir
# en el mensaje de respuesta. Sin efecto si check-credit-on-submit=false.
jde.cart.block-on-credit-exceeded=false

# ============================================================================
# Creacion de pedidos de venta (oracle.e1.bssv.JP420000.SalesOrderManager.
# processSalesOrderV5, ver JdeSalesOrderClient.createSalesOrder y
# .claude/generaciondepedido.md) -- defaults NUNCA decididos por el modelo LLM.
# ============================================================================

# salesOrderKey.documentTypeCode -- tipo de documento del pedido de venta a crear.
jde.sales-order.document-type-code=SO
# company (header.company, ej "0001") y documentCompany (salesOrderKey.documentCompany,
# ej "00001") son campos DISTINTOS con distinta longitud/padding en el payload BSSV
# real -- no normalizar como si fueran el mismo campo (ver generaciondepedido.md).
jde.sales-order.company=0001
jde.sales-order.document-company=00001
# detail[].lineTypeCode -- tipo de linea (ej "S" = Stock/venta estandar).
jde.sales-order.line-type-code=S
# header.processing.actionType / detail[].processing.actionType -- "A" = Add,
# segun el ejemplo real de generaciondepedido.md.
jde.sales-order.action-type=A
# header.processing.processingVersion para processSalesOrderV5. Property separada
# de jde.pricing.default-processing-version (que controla la version de las
# operaciones de precio) aunque hoy compartan el mismo valor por defecto -- no hay
# garantia de que en un ambiente real sean la misma version de procesamiento JDE.
jde.sales-order.processing-version=ZJDE0001
# dateRequested (header.dateRequested) = hoy + este valor, NUNCA igual a dateOrdered
# (hoy). dateRequested es la fecha en la que el cliente pide recibir/disponer de los
# productos, usada por JDE para calcular la fecha de pick/promised-ship contra el lead
# time del business unit/articulo -- si coincide con dateOrdered (pedido para "hoy
# mismo"), JDE no tiene margen para programar el pick y devuelve un warning (confirmado
# contra un envio real que devolvio ese warning con dateRequested=dateOrdered=hoy, ver
# generaciondepedido.md). 30 dias replica el margen usado en el request de Postman que
# se confirmo sin warnings -- ajustar si el lead time real configurado en JDE difiere.
jde.sales-order.default-requested-date-lead-days=30

# jde_submit_current_sales_cart usa el mismo motor generico de tareas largas que las
# demas tools de sales order (jde.mcp.tasks.*) -- mismo kill switch/logica: arranca
# la creacion del pedido en background y devuelve rapido "todavia en curso" si no
# termina a tiempo, en vez de bloquear el request. El estado SUBMITTING/ORDER_CREATED
# del carrito (marcado atomicamente antes de la llamada) sigue previniendo un doble
# submit exitoso, corra sincrono o a traves de este motor.
jde.sales-order.submit.async.enabled=false
jde.sales-order.submit.async.initial-wait-seconds=60

# Progress notifications del protocolo MCP ("notifications/progress") durante llamadas
# lentas a JDE. Apagado por defecto: hoy Claude Desktop no manda progressToken ni
# respeta resetTimeoutOnProgress (ver anthropics/claude-code#58687, cerrado "not
# planned"), asi que no tiene ningun efecto para ese cliente. Activar (true) el dia
# que algun cliente MCP lo soporte -- no requiere tocar codigo.
jde.mcp.progress-notifications.enabled=false

# Motor generico de tareas largas (com.atina.jdeMCPServer.mcp.tasks.LongRunningTaskRegistry)
# -- infra reusable para exponer cualquier tool lento sin bloquear el request MCP
# original, modelada sobre los mismos campos/estados que la extension oficial de MCP
# para esto (SEP-2663 "Tasks", https://modelcontextprotocol.io/seps/2663-tasks-extension),
# que todavia no soportan ni el SDK Java de MCP ni los clientes reales en uso. Sin
# persistencia a proposito (ConcurrentHashMap en memoria): si el server se reinicia,
# el estado se pierde y el proximo llamado arranca una tarea nueva.
jde.mcp.tasks.executor-pool-size=2
jde.mcp.tasks.default-poll-interval-ms=5000
# Cuanto tiempo despues de terminar (exito o error) se sigue sirviendo el mismo
# resultado sin recomputar, para tolerar reintentos rapidos duplicados del mismo
# agente. Pasado esto, la proxima consulta con los mismos parametros arranca de cero.
jde.mcp.tasks.completed-grace-period-seconds=30
# Frecuencia (en minutos) del barrido que purga tareas terminales vencidas aunque
# nadie las vuelva a consultar (mismo criterio que jde.purchase.pending-order-cleanup-interval-minutes).
jde.mcp.tasks.cleanup-interval-minutes=5

# Identity mapping DB (H2 embebido en archivo, migraciones Flyway).
# AUTO_SERVER=TRUE permite conectarse con un cliente H2 externo (para inserts manuales)
# mientras el server corre. La URL (spring.datasource.url) es especifica de cada
# ambiente -- cada uno usa su propio archivo, ver application-{dev,stage,prod}.properties.
spring.datasource.username=sa
spring.datasource.password=

# Identity Bridge
# Implementacion activa de IdentityResolver: native (tabla identity_mapping) | federated (LDAP, futuro)
jde.identity.resolver=native

# OpenBao (vault de credenciales JDE) - nunca hardcodear el token.
# jde.vault.addr / jde.vault.token son especificos de cada ambiente
# (en dev tienen fallback a localhost; en stage/prod son obligatorios), ver
# application-{dev,stage,prod}.properties.

# Tokens del microservicio de Atina (HS256) aceptados como alternativa a Keycloak.
# El secreto es el mismo con el que firma el microservicio; el issuer es el claim
# "iss" que traen esos tokens. ATINA_JWT_SECRET viaja en Base64 estandar (no
# URL-safe, no texto plano) -- el microservicio la decodifica con
# DatatypeConverter.parseBase64Binary -- y este server replica ese mismo decode
# antes de usarla como clave HMAC. Sin ATINA_JWT_SECRET configurado, los tokens
# de Atina se rechazan (Keycloak sigue funcionando normal).
jde.atina.jwt.secret=${ATINA_JWT_SECRET:}
# Opt-in: si se setea, exige que el token de Atina traiga ese valor en "aud".
# Vacio (default) = no se exige, porque hoy el microservicio no emite ese claim.
# Activar solo despues de coordinar con Atina para que empiece a incluirlo.
jde.atina.jwt.expected-audience=
jde.atina.jwt.issuer=Issue
# Nombre del claim en el JWT de Keycloak que trae el token de sesion JDE emitido
# por Atina. Cuando el usuario se autentica con Keycloak y su token incluye este
# claim, su valor se usa directamente como X-Approver-Token (sin Identity Bridge
# ni vault). Vacio o ausente el claim = se sigue con el flujo del Identity Bridge.
jde.atina.token-claim=atina_token
# Fuente del token de sesion JDE de Atina cuando el usuario entra por Keycloak.
# Hace convivir la etapa 1 (claim del JWT) y la etapa 2 (OpenBao). Valores:
#   claim            -> solo el claim "atina_token" del JWT (etapa 1, default)
#   vault            -> solo el token guardado en OpenBao secret/data/jde/atina/{sub} (etapa 2)
#   claim-then-vault -> primero el claim; si no esta, OpenBao
#   vault-then-claim -> primero OpenBao; si no esta (o el vault falla), el claim
# Mismo default en los tres ambientes hoy; si un ambiente necesita otra etapa de
# rollout, sobreescribir jde.atina.session-source en su application-{perfil}.properties.
jde.atina.session-source=claim

# Tiempo maximo en milisegundos para que un conector espere a que se complete una solicitud.
server.tomcat.connection-timeout=600000
# Tiempo maximo en milisegundos que el servidor espere a que se lea la entrada del cliente.
server.tomcat.keep-alive-timeout=600000
#
# --------------------------------------------------------------------------------
# Para MCP Streamable HTTP, /mcp debe estar expuesto como un endpoint HTTP normal.
# En Spring Boot, para probar, asegurate de no tener:
# --------------------------------------------------------------------------------
#
server.http2.enabled=false
#
# --------------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------------
#
# Muestra el correlation ID (ver CorrelationIdContext, que lo espeja a MDC) en
# cada linea de log de la request -- "-" cuando no hay ninguno en contexto
# (arranque del server, hilos fuera de un tools/call).
logging.pattern.level=%5p [correlationId=%X{correlationId:--}]
#
# Ademas de stdout (lo que hoy captura `docker logs` / la consola del IDE), deriva
# el log a archivo -- mismo criterio de ruta relativa que el H2 de identity-mapping
# (ver spring.datasource.url en application-{dev,stage,prod}.properties): en Docker
# resuelve a /app/logs (WORKDIR del Dockerfile), montado como volumen en
# docker-compose.yml para persistir entre reinicios y poder leerlo desde el host.
# Rotacion: defaults de Spring Boot (10MB por archivo, gzip, 7 dias de historial) --
# ver logging.logback.rollingpolicy.* si hace falta ajustarlos.
logging.file.name=./logs/jde-mcp-server.log
#
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.reactive=DEBUG
#logging.level.reactor.netty.http.server=DEBUG
#logging.level.io.modelcontextprotocol=DEBUG
#
